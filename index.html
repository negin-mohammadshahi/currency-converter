<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Currency Converter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #0F1B2D;
        --bg-accent: #16263F;
        --card: #FAFAFA;
        --teal: #1FA37A;
        --teal-dark: #178563;
        --text-dark: #1A2433;
        --text-muted: #6B7280;
        --error: #D64545;
        --border: #E3E6EA;
    }

    * { box-sizing: border-box; }

    body {
        font-family: 'Inter', Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at 20% 20%, var(--bg-accent), var(--bg) 60%);
        color: var(--text-dark);
    }

    .card {
        background: var(--card);
        width: 100%;
        max-width: 420px;
        border-radius: 16px;
        padding: 36px 32px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.06);
    }

    .eyebrow {
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--teal-dark);
        margin: 0 0 4px;
    }

    h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 26px;
        font-weight: 700;
        margin: 0 0 24px;
        color: var(--text-dark);
    }

    label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 6px;
        text-align: left;
    }

    input, select {
        width: 100%;
        padding: 12px 14px;
        font-size: 16px;
        font-family: 'Inter', sans-serif;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text-dark);
    }

    input:focus, select:focus, button:focus-visible {
        outline: 2px solid var(--teal);
        outline-offset: 1px;
    }

    .field { margin-bottom: 16px; text-align: left; }

    .row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
    }

    .row .field { flex: 1; margin-bottom: 16px; }

    #switchBtn {
        background: #fff;
        color: var(--teal-dark);
        border: 1px solid var(--border);
        width: 44px;
        height: 44px;
        min-width: 44px;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s ease, transform 0.15s ease;
    }

    #switchBtn:hover { background: #F0FAF6; }
    #switchBtn:active { transform: rotate(180deg); }

    button.primary {
        width: 100%;
        background: var(--teal);
        color: #fff;
        padding: 13px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        cursor: pointer;
        margin-top: 4px;
        transition: background 0.15s ease;
    }

    button.primary:hover { background: var(--teal-dark); }

    #rateInfo {
        font-family: 'Inter', monospace;
        font-size: 12.5px;
        color: var(--text-muted);
        margin-top: 10px;
        min-height: 16px;
        letter-spacing: 0.02em;
    }

    #rateInfo .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--teal);
        margin-right: 6px;
    }

    .result-box {
        margin-top: 22px;
        padding: 18px;
        border-radius: 12px;
        background: #F0FAF6;
        border: 1px solid #D7EFE3;
        min-height: 28px;
        text-align: center;
    }

    .result-box.error {
        background: #FCEDED;
        border-color: #F5CACA;
    }

    #result {
        font-family: 'Space Grotesk', sans-serif;
        color: var(--teal-dark);
        font-size: 21px;
        font-weight: 700;
        margin: 0;
    }

    .result-box.error #result {
        color: var(--error);
        font-size: 15px;
        font-weight: 500;
        font-family: 'Inter', sans-serif;
    }

    #copyBtn {
        background: transparent;
        color: var(--text-muted);
        border: 1px solid var(--border);
        padding: 8px 16px;
        font-size: 13px;
        font-family: 'Inter', sans-serif;
        border-radius: 8px;
        cursor: pointer;
        display: none;
        margin: 14px auto 0;
    }

    #copyBtn:hover { background: #F4F6F8; color: var(--text-dark); }

    .irr-note {
        font-size: 12px;
        color: #92702A;
        background: #FEF6E7;
        border: 1px solid #F5E3B9;
        border-radius: 8px;
        padding: 8px 12px;
        margin: 14px 0 0;
        text-align: center;
        line-height: 1.4;
    }
</style>
</head>
<body>
    <div class="card">
        <p class="eyebrow">Live exchange rates</p>
        <h1>💱 Currency Converter</h1>

        <div class="field">
            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount" inputmode="decimal">
        </div>

        <div class="row">
            <div class="field">
                <label for="from">From</label>
                <select id="from">
                    <option value="USD">USD — US Dollar</option>
                    <option value="EUR">EUR — Euro</option>
                    <option value="GBP">GBP — British Pound</option>
                    <option value="RUB">RUB — Russian Ruble</option>
                    <option value="IRR">IRR — Iranian Rial</option>
                </select>
            </div>

            <button id="switchBtn" onclick="switchCurrencies()" title="Swap currencies" aria-label="Swap currencies">⇄</button>

            <div class="field">
                <label for="to">To</label>
                <select id="to">
                    <option value="USD">USD — US Dollar</option>
                    <option value="EUR">EUR — Euro</option>
                    <option value="GBP">GBP — British Pound</option>
                    <option value="RUB">RUB — Russian Ruble</option>
                    <option value="IRR" selected>IRR — Iranian Rial</option>
                </select>
            </div>
        </div>

        <button class="primary" onclick="convert()">Convert</button>

        <div id="rateInfo"></div>

        <div class="result-box" id="resultBox" style="display:none;">
            <p id="result"></p>
        </div>

        <p id="irrNote" class="irr-note" style="display:none;">⚠️ Official rate shown — may differ from Iran's free-market rate.</p>

        <button id="copyBtn" onclick="copyResult()">Copy result</button>
    </div>

    <script>
        const amountEl = document.getElementById('amount');
        const fromEl = document.getElementById('from');
        const toEl = document.getElementById('to');
        const resultEl = document.getElementById('result');
        const resultBox = document.getElementById('resultBox');
        const rateInfoEl = document.getElementById('rateInfo');
        const copyBtn = document.getElementById('copyBtn');
        const irrNote = document.getElementById('irrNote');

        let debounceTimer;
        let lastResultText = '';

        // Restore the user's last selection
        window.addEventListener('DOMContentLoaded', () => {
            const saved = JSON.parse(localStorage.getItem('currencyPrefs') || 'null');
            if (saved) {
                fromEl.value = saved.from || 'USD';
                toEl.value = saved.to || 'IRR';
                if (saved.amount) amountEl.value = saved.amount;
            }
            if (amountEl.value) convert();
        });

        function savePrefs() {
            localStorage.setItem('currencyPrefs', JSON.stringify({
                from: fromEl.value,
                to: toEl.value,
                amount: amountEl.value
            }));
        }

        function switchCurrencies() {
            const temp = fromEl.value;
            fromEl.value = toEl.value;
            toEl.value = temp;
            savePrefs();
            if (amountEl.value) convert();
        }

        function showResult(text, isError) {
            resultBox.style.display = 'block';
            resultBox.classList.toggle('error', isError);
            resultEl.innerText = text;
        }

        async function convert() {
            const amount = amountEl.value;
            const from = fromEl.value;
            const to = toEl.value;

            savePrefs();

            if (!amount) {
                showResult('Enter an amount to convert', true);
                rateInfoEl.innerText = '';
                copyBtn.style.display = 'none';
                irrNote.style.display = 'none';
                return;
            }

            irrNote.style.display = (from === 'IRR' || to === 'IRR') ? 'block' : 'none';

            showResult('Calculating…', false);

            try {
                const response = await fetch(`https://open.er-api.com/v6/latest/${from}`);
                const data = await response.json();

                if (data.result !== 'success') {
                    throw new Error('API did not return a successful result');
                }

                const rate = data.rates[to];

                if (!rate) {
                    throw new Error(`No rate found for ${to}`);
                }

                const result = (amount * rate).toFixed(2);

                showResult(`${amount} ${from} = ${result} ${to}`, false);
                rateInfoEl.innerHTML = `<span class="dot"></span>1 ${from} = ${rate.toFixed(4)} ${to}`;
                lastResultText = resultEl.innerText;
                copyBtn.style.display = 'block';
            } catch (error) {
                showResult('Could not fetch exchange rates. Please try again.', true);
                rateInfoEl.innerText = '';
                copyBtn.style.display = 'none';
                irrNote.style.display = 'none';
            }
        }

        // Convert automatically as the user types (debounced)
        amountEl.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                if (amountEl.value) convert();
            }, 500);
        });

        fromEl.addEventListener('change', () => { if (amountEl.value) convert(); });
        toEl.addEventListener('change', () => { if (amountEl.value) convert(); });

        function copyResult() {
            navigator.clipboard.writeText(lastResultText).then(() => {
                const original = copyBtn.innerText;
                copyBtn.innerText = 'Copied!';
                setTimeout(() => { copyBtn.innerText = original; }, 1500);
            });
        }
    </script>
</body>
</html>
